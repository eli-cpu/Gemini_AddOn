<!-- Simplified icon for 16/32px (toolbar): fewer, thicker shapes. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c8dff"/>
      <stop offset="1" stop-color="#7b4dff"/>
    </linearGradient>
  </defs>
  <rect width="16" height="16" rx="3.5" fill="url(#bg)"/>
  <!-- bubbles -->
  <rect x="3" y="3" width="8" height="3" rx="1.5" fill="#22d3c5"/>
  <rect x="5" y="5.5" width="8" height="3" rx="1.5" fill="#ff9f43"/>
  <!-- folder front -->
  <rect x="1.5" y="8" width="13" height="6.5" rx="1.5" fill="#ffffff"/>
  <rect x="6" y="10" width="4" height="1.2" rx=".6" fill="#7b4dff" opacity=".6"/>
</svg>
