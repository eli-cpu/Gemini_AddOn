<!-- Gemini AddOn icon (48px and up). Rendered to PNG via `npm run icons`. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c8dff"/>
      <stop offset="1" stop-color="#7b4dff"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6ecff"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- folder back with tab -->
  <path d="M9 21a4 4 0 0 1 4-4h11.5a3 3 0 0 1 2.1.9L29.5 21H51a4 4 0 0 1 4 4v24H9z" fill="#c9d6ff"/>

  <!-- chat bubbles peeking out -->
  <g>
    <rect x="15" y="21" width="30" height="8" rx="4" fill="#22d3c5"/>
    <path d="M20 28.5l-1 4 4.5-4z" fill="#22d3c5"/>
    <rect x="20" y="26.5" width="30" height="8" rx="4" fill="#ff9f43"/>
    <path d="M44 34l1.5 3.5 1-3.5z" fill="#ff9f43"/>
    <rect x="13" y="32" width="28" height="8" rx="4" fill="#ff5fa2"/>
  </g>

  <!-- folder front -->
  <rect x="7" y="34" width="50" height="19" rx="5" fill="url(#front)"/>
  <!-- handle -->
  <rect x="25" y="39" width="14" height="3.2" rx="1.6" fill="#7b4dff" opacity=".55"/>
</svg>
